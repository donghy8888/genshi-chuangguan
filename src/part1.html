<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>根式闯关 · 二次根式每日练</title>
<style>
:root{--ink:#2d2a4a;--sub:#7a7699;--pri:#ff7a59;--ok:#22c55e;--warn:#ff9f43;--gold:#ffc83d;--pur:#7c5cff;--blue:#4f8bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;color:var(--ink);background:linear-gradient(165deg,#8b6dff 0%,#5aa9ff 55%,#5ee0d0 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:14px 14px 104px}
#app.noNav{padding-bottom:30px}
.card{background:#fff;border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 8px 0 rgba(60,40,140,.12),0 14px 30px rgba(40,20,120,.12)}
h2{margin:0 0 10px;font-size:20px}
.sub{color:var(--sub);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.btn{border:none;border-radius:18px;padding:15px 20px;font-size:18px;font-weight:800;min-height:54px;background:#eef0ff;color:var(--pur);box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.pri{background:linear-gradient(180deg,#ff9a6b,#ff6a4d);color:#fff;box-shadow:0 5px 0 #d94f33}
.btn.ok{background:linear-gradient(180deg,#4ade80,#22c55e);color:#fff;box-shadow:0 5px 0 #15913f}
.btn.pur{background:linear-gradient(180deg,#9b83ff,#7c5cff);color:#fff;box-shadow:0 5px 0 #5a3fd6}
.btn.gold{background:linear-gradient(180deg,#ffe07a,#ffbf2e);color:#6b4500;box-shadow:0 5px 0 #d99a10}
.btn.ghost{background:#f3f2fa;color:var(--sub)}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.6}
.top{display:flex;align-items:center;gap:10px;color:#fff}
.lvchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.22);border-radius:18px;padding:6px 10px;flex:1;min-width:0}
.lvnum{background:var(--gold);color:#6b4500;font-weight:900;border-radius:12px;padding:4px 8px;font-size:14px;white-space:nowrap}
.lvt{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffe07a,#ffb02e);border-radius:9px;transition:width .6s}
.fire{background:rgba(255,255,255,.22);border-radius:18px;padding:8px 12px;font-weight:900;font-size:18px;white-space:nowrap}
.iconbtn{border:none;background:rgba(255,255,255,.22);border-radius:16px;width:46px;height:46px;font-size:22px;color:#fff;flex:none}
.hero{display:flex;align-items:center;gap:12px;color:#fff;margin:12px 4px 0}
.hero .bub{background:#fff;color:var(--ink);border-radius:18px;padding:10px 14px;font-size:15px;font-weight:600;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.hero .bub:before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.mascot{flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.daily{background:linear-gradient(135deg,#fff 0%,#fff6ec 100%)}
.daily .big{font-size:22px;font-weight:900}
.pill{display:inline-block;background:#f0edff;color:var(--pur);border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700;margin:2px 4px 2px 0}
.pill.o{background:#fff1e6;color:#e2672f}
.pill.g{background:#e7f9ee;color:#15913f}
.prog{height:14px;background:#f0eef8;border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#4fc3ff);border-radius:10px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh button{border:none;background:#f3f2fa;border-radius:12px;width:40px;height:40px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cw{font-size:12px;color:var(--sub);font-weight:700}
.cd{aspect-ratio:1;border-radius:12px;background:#f6f5fb;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:#aaa6c4;position:relative}
.cd.e{background:none}
.cd.on{background:linear-gradient(180deg,#ffd27a,#ff9a5a);color:#fff;font-weight:800}
.cd .fl{font-size:14px;line-height:1}
.cd.on .dn{font-size:11px}
.cd.td{outline:3px solid var(--pur);outline-offset:-3px;color:var(--pur);font-weight:900}
.cd.on.td{color:#fff}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);box-shadow:0 -6px 20px rgba(40,20,120,.15);z-index:20;border-radius:22px 22px 0 0}
#nav .in{display:flex;max-width:520px;width:100%}
#nav button{flex:1;border:none;background:none;padding:6px 0;font-size:12px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;border-radius:14px}
#nav button b{font-size:24px;line-height:1.1}
#nav button.on{color:var(--pur);background:#f0edff}
.map{position:relative;margin:4px 0 10px}
.map svg.path{position:absolute;left:0;top:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;width:120px}
.node .c{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;background:linear-gradient(180deg,#9b83ff,#6d4cf5);box-shadow:0 6px 0 #4b2fc4,0 10px 20px rgba(0,0,0,.2);position:relative}
.node.passed .c{background:linear-gradient(180deg,#ffe07a,#ffb52e);box-shadow:0 6px 0 #d99a10,0 10px 20px rgba(0,0,0,.2);color:#6b4500}
.node.locked .c{background:linear-gradient(180deg,#d9d6ea,#b9b4d3);box-shadow:0 6px 0 #9893b5;color:#fff}
.node.cur .c{animation:pulse 1.4s infinite}
.node.boss .c{width:96px;height:96px;font-size:44px;background:linear-gradient(180deg,#ff8a8a,#e5484d);box-shadow:0 6px 0 #a8262b,0 10px 20px rgba(0,0,0,.25)}
.node.boss.locked .c{background:linear-gradient(180deg,#d9d6ea,#b9b4d3);box-shadow:0 6px 0 #9893b5}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.node .lb{margin-top:8px;background:#fff;border-radius:12px;padding:3px 9px;font-size:13px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
.node .st{font-size:15px;letter-spacing:-1px;margin-top:3px;height:18px}
.star-off{filter:grayscale(1);opacity:.35}
.cur-flag{position:absolute;top:-30px;font-size:26px;animation:bob 1.2s infinite}
.qtop{display:flex;align-items:center;gap:10px;color:#fff}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dot{width:22px;height:10px;border-radius:6px;background:rgba(255,255,255,.4)}
.dot.cur{background:#fff;width:34px}
.dot.g{background:#4ade80}.dot.o{background:#ffb067}
.combo{background:linear-gradient(180deg,#ffe07a,#ffb02e);color:#6b4500;border-radius:14px;padding:6px 10px;font-weight:900;white-space:nowrap}
.combo.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.qcard{padding:22px 18px}
.qtag{font-size:13px;font-weight:800;color:var(--pur);background:#f0edff;display:inline-block;padding:4px 10px;border-radius:10px;margin-bottom:10px}
.qtag.rev{background:#fff1e6;color:#e2672f;margin-left:6px}
.stem{font-size:22px;line-height:1.9;font-weight:700;word-break:break-word}
.opts{display:grid;gap:12px;margin-top:6px}
.opt{display:flex;align-items:center;gap:12px;border:3px solid #e8e5f6;background:#fff;border-radius:20px;padding:12px 14px;min-height:66px;font-size:21px;font-weight:700;text-align:left;box-shadow:0 5px 0 #e8e5f6;transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #e8e5f6}
.opt .ol{flex:none;width:36px;height:36px;border-radius:12px;background:#f0edff;color:var(--pur);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900}
.opt .ot{flex:1;line-height:1.8}
.opt.right{border-color:#22c55e;background:#ecfdf3;box-shadow:0 5px 0 #a7e9bf}
.opt.right .ol{background:#22c55e;color:#fff}
.opt.wrongc{border-color:#ffb067;background:#fff6ec;box-shadow:0 5px 0 #ffd9b3;animation:shake .4s}
.opt.wrongc .ol{background:#ff9f43;color:#fff}
.opt.dim{opacity:.55}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fill{display:flex;gap:10px;margin-top:6px}
.fill input{flex:1;min-width:0;font-size:26px;font-weight:800;border:3px solid #e8e5f6;border-radius:18px;padding:10px 14px;text-align:center;font-family:inherit;color:var(--ink);outline:none}
.fill input:focus{border-color:var(--pur)}
.fill input.bad{animation:shake .4s;border-color:#ff9f43}
.hintb{margin-top:16px;background:#fffbe6;border:2px dashed #ffd666;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.8}
.qbar{display:flex;gap:10px;margin-top:4px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);visibility:hidden;transition:transform .35s cubic-bezier(.2,1.2,.4,1),visibility 0s .35s}
#sheet.show{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,1.2,.4,1)}
#sheet .in{max-width:520px;margin:0 auto;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
#sheet .in.ok{background:#ecfdf3}
#sheet .in.no{background:#fff7ee}
.fbh{display:flex;align-items:center;gap:12px}
.fbh .t{font-size:24px;font-weight:900}
.ok .fbh .t{color:#15913f}.no .fbh .t{color:#e2672f}
.steps{background:#fff;border-radius:16px;padding:10px 14px;margin:12px 0;font-size:17px;line-height:1.9}
.steps ol{margin:4px 0;padding-left:22px}
.steps li{margin:2px 0}
.ansline{background:#fff;border-radius:14px;padding:8px 12px;margin-top:10px;font-size:18px;font-weight:700;line-height:1.9}
.rad{display:inline-flex;align-items:stretch;vertical-align:middle;line-height:1.25;margin:0 1px}
.rs{position:relative;width:.62em;flex:none}
.rs svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.ri{border-top:.09em solid currentColor;padding:.08em .14em 0 .1em;display:inline-flex;align-items:center;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.25;margin:0 2px}
.fr>span{display:block;padding:0 3px;white-space:nowrap}
.fr .fn{border-bottom:.1em solid currentColor}
.ri .fr{font-size:.82em}
.res{text-align:center}
.bigstars{font-size:58px;margin:8px 0}
.bigstars span{display:inline-block;animation:starin .6s both}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.res .score{font-size:40px;font-weight:900;color:var(--pur)}
.stack{display:grid;gap:12px;margin-top:16px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{background:#f8f7fd;border-radius:18px;padding:12px 6px;text-align:center}
.bdg .e{font-size:36px}
.bdg .n{font-weight:900;font-size:14px;margin-top:4px}
.bdg .d{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4}
.bdg.off .e{filter:grayscale(1);opacity:.35}
.bdg.off{background:#f3f2f7}
.bdg.on{background:linear-gradient(180deg,#fff7d6,#ffe9a8)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat div{background:#f6f5fb;border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--pur)}
.kp{margin:10px 0}
.kp .row{font-size:15px;font-weight:700}
.witem{border:2px solid #efedf8;border-radius:18px;padding:12px;margin:10px 0}
.witem summary{list-style:none;cursor:pointer}
.witem summary::-webkit-details-marker{display:none}
.witem .wst{font-size:17px;line-height:1.8;font-weight:600}
.sr{display:inline-flex;gap:3px;vertical-align:middle}
.sr i{width:12px;height:12px;border-radius:50%;background:#e4e1f2;display:inline-block}
.sr i.f{background:#22c55e}
#modal{position:fixed;inset:0;background:rgba(30,20,70,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:26px;padding:22px;max-width:440px;width:100%;max-height:88vh;overflow:auto;animation:pop .35s}
#toasts{position:fixed;top:12px;left:0;right:0;z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#2d2a4a;color:#fff;border-radius:18px;padding:12px 18px;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:tin .4s both;max-width:92vw;text-align:center}
.toast.gold{background:linear-gradient(90deg,#ffb02e,#ff7a59)}
@keyframes tin{from{transform:translateY(-30px);opacity:0}}
.cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:65;pointer-events:none;animation:fall var(--t) cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.xpf{position:fixed;left:50%;top:38%;z-index:66;font-size:34px;font-weight:900;color:#ffb02e;text-shadow:0 3px 0 #fff,0 0 12px rgba(255,255,255,.9);pointer-events:none;animation:xpup 1.2s ease-out forwards;white-space:nowrap}
@keyframes xpup{0%{transform:translate(-50%,20px) scale(.5);opacity:0}25%{transform:translate(-50%,0) scale(1.2);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
.switch{width:62px;height:36px;border-radius:20px;background:#ddd;border:none;position:relative;flex:none}
.switch:after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)}
.switch.on:after{left:30px}
.danger{color:#e5484d}
.ptitle{color:#fff;font-size:24px;font-weight:900;margin:6px 4px 0;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.center{text-align:center}
@media (min-width:700px){.stem{font-size:24px}}

/* import & lesson */
.impcard{background:linear-gradient(135deg,#fff 0%,#f0edff 100%);border:3px dashed #c4b5ff}
.sheet-thumb{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#eee;flex:none}
.sheet-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid #efedf8;border-radius:18px;margin:10px 0;cursor:pointer;text-align:left;width:100%;background:#fff;font-family:inherit;color:inherit}
.sheet-item:active{background:#f8f7fd}
.prevw{width:100%;max-height:280px;object-fit:contain;border-radius:16px;background:#f3f2fa;display:block}
.filebtn{position:relative;overflow:hidden}
.filebtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:40px}
.tgl{display:flex;align-items:center;gap:12px;padding:12px;border:3px solid #e8e5f6;border-radius:18px;margin:8px 0;background:#fff;cursor:pointer;font-weight:700;font-size:16px;text-align:left;width:100%;font-family:inherit;color:inherit;min-height:56px}
.tgl.on{border-color:var(--pur);background:#f0edff}
.tgl .ck{flex:none;width:28px;height:28px;border-radius:10px;border:3px solid #cfc9e8;display:flex;align-items:center;justify-content:center;font-size:16px;background:#fff}
.tgl.on .ck{background:var(--pur);border-color:var(--pur);color:#fff}
.note{width:100%;min-height:88px;border:3px solid #e8e5f6;border-radius:16px;padding:12px;font-size:16px;font-family:inherit;resize:vertical;color:var(--ink);outline:none}
.note:focus{border-color:var(--pur)}
.scan{text-align:center;padding:30px 10px}
.scan .eye{font-size:48px;animation:bob 1s infinite}
.scan .bar{height:10px;background:#f0eef8;border-radius:8px;overflow:hidden;margin:18px auto;max-width:220px}
.scan .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,#7c5cff,#4fc3ff);border-radius:8px;animation:scan 1.2s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-20%)}100%{transform:translateX(280%)}}
.lesson .formula{background:#f0edff;border-radius:16px;padding:14px;font-size:20px;font-weight:800;line-height:1.9;margin:10px 0;text-align:center}
.lesson .kou{background:linear-gradient(135deg,#fff7d6,#ffe9a8);border-radius:16px;padding:12px 14px;font-size:17px;font-weight:800;margin:12px 0;line-height:1.6}
.lesson .ex{background:#fff;border:2px solid #efedf8;border-radius:16px;padding:12px 14px;margin:10px 0}
.lesson .ex .ttl{font-weight:900;color:var(--pur);margin-bottom:6px}
.chklist{margin:0;padding:0;list-style:none}
.chklist li{background:#f8f7fd;border-radius:14px;padding:10px 12px;margin:8px 0;font-weight:700;font-size:15px;line-height:1.6}
.chklist li b{color:var(--pur)}

/* study timer */
.live-timer{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:14px;padding:6px 12px;font-weight:900;font-size:16px;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.5px;white-space:nowrap}
.live-timer.pause{opacity:.7}
.live-timer .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.35);animation:blink 1.2s infinite}
.live-timer.pause .dot{background:#ffb067;animation:none;box-shadow:none}
@keyframes blink{50%{opacity:.35}}
.timecard{background:linear-gradient(135deg,#fff 0%,#eef9ff 55%,#f5f0ff 100%)}
.timecard .tbig{font-size:28px;font-weight:900;color:var(--pur);font-variant-numeric:tabular-nums}
.timecard .tlab{font-size:12px;color:var(--sub);font-weight:700}
.weekbars{display:flex;align-items:flex-end;gap:6px;height:72px;margin-top:10px}
.weekbars .wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.weekbars .bar{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#9b83ff,#4fc3ff);min-height:4px;transition:height .4s}
.weekbars .bar.on{background:linear-gradient(180deg,#ffd27a,#ff7a59)}
.weekbars .wd{font-size:11px;font-weight:800;color:var(--sub)}
.weekbars .wb.td .wd{color:var(--pur)}
.encourage{background:#e7f9ee;color:#15913f;border-radius:14px;padding:10px 12px;font-weight:800;font-size:15px;margin-top:10px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chapter-card{display:block;width:100%;text-align:left;border:2px solid rgba(124,92,255,.14);font:inherit;color:inherit;cursor:pointer}.chapter-card:focus-visible{outline:3px solid #ffbf2e;outline-offset:3px}.chapter-icon{width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:#f0edff;border-radius:18px;font-size:30px}.chapter-card .sub{line-height:1.55}.chapter-card:hover{border-color:#a79aff}
#nav .in{justify-content:center}#nav button{max-width:240px;width:100%;font-size:16px}#nav button b{font-size:23px}
.level-sheet{display:flex;align-items:center;gap:8px;justify-content:center;width:100%;margin-top:12px;border:2px dashed #cfc7ff;border-radius:15px;background:#f7f4ff;padding:11px;font-size:14px;font-weight:800;color:#6953ce;cursor:pointer}
.sheet-prompt{margin:12px 0 0;padding:10px 12px;background:#fff6e9;border-radius:12px;color:#77542c;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"><div class="in"><button data-v="chapters" onclick="go('chapters')"><b>🗺️</b>闯关</button></div></nav>
<div id="sheet"><div class="in"></div></div>
<div id="modal"><div class="box"></div></div>
<div id="toasts"></div>
