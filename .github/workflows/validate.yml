name: Validate math practice app

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Skill tags, mistake-book labels, and subskill diagnostics share the scoring test suite.
      - name: Run scoring, skill-path, and diagnosis unit tests
        run: node --test tests/session-scoring.test.js
      - name: Check JavaScript syntax
        run: |
          node --check src/questions.js
          node --check src/app.js
      - name: Check build script syntax
        run: sh -n src/build.sh
      - name: Build standalone site
        run: sh src/build.sh
      - name: Verify committed site matches the current source build
        run: git diff --exit-code -- index.html
      - name: Verify unified chapter catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home = Path("index.html").read_text(encoding="utf-8")
          course = Path("yiyuan-erci-fangcheng.html").read_text(encoding="utf-8")
          required = ["function vChapters()", "const CHAPTERS=", "id:'radicals'", "id:'quadratic'", 'data-v="chapters"', "function openChapter("]
          for token in required:
              if token not in home:
                  raise SystemExit("Chapter catalog missing: " + token)
          if './index.html#chapters' not in course:
              raise SystemExit("Quadratic course must return to shared chapter catalog")
          print("Shared course catalog and return navigation verified")
          PY
      - name: Check quadratic-equations course script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("yiyuan-erci-fangcheng.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S | re.I)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one course script, found {len(scripts)}")
          script = scripts[0]
          if script.count("id:") < 8 or script.count("qs:[") != 8:
              raise SystemExit("Expected eight units with question sets")
          if "localStorage" not in script or "function answer(" not in script:
              raise SystemExit("Course progress or answer handling is missing")
          if "const remedialLessons" not in script or "function showRemedial(" not in script or "function checkRemedial(" not in script:
              raise SystemExit("Targeted remedial micro-practice is missing")
          if "state.weaknesses" not in script or "function renderHome(" not in script:
              raise SystemExit("Persistent weak-skill tracking and review recommendations are missing")
          if script.count("correct:") < 8:
              raise SystemExit("Expected a remedial micro-question for every unit")
          Path("/tmp/quadratic-course.js").write_text(script, encoding="utf-8")
          print("Found eight learning units and extracted the course script")
          PY
          node --check /tmp/quadratic-course.js
      - name: Check generated page JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("No generated inline script found")
          Path("/tmp/generated-app.js").write_text(scripts[-1], encoding="utf-8")
          print(f"Extracted generated JavaScript: {len(scripts[-1])} characters")
          PY
          node --check /tmp/generated-app.js
